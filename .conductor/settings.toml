"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Conductor scripts run from the workspace ROOT. The pnpm monorepo lives in the
# screenly/ subdirectory, so commands cd into it first. The env is copied from a
# master file kept on the Desktop (outside any repo): ~/Desktop/env/screenly/.env
[scripts]
setup = 'cd screenly && pnpm install && cp "$HOME/Desktop/env/screenly/.env" .env'
run = "cd screenly && pnpm dev"
# Single local Postgres (docker `screenly-postgres` on :5432) + the app on :3000
# are shared resources, so only one workspace runs at a time. To go concurrent,
# give each workspace its own DB and pass --port "$CONDUCTOR_PORT" to `next dev`.
run_mode = "nonconcurrent"
